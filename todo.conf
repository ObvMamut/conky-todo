-- Colours come from chroma (~/.config/chroma, target "conky_todo"). If the
-- generated file is missing, fall back to the original Catppuccin values so
-- the widget still starts.
local ok, C = pcall(dofile, os.getenv('HOME') .. '/.config/conky/todo/colors.lua')
if not ok then
    C = { bg = '1E1E2E', fg = 'D9E0EE', accent = 'F5C2E7', green = 'A6E3A1', dim = '6C7086' }
end

conky.config = {
    -- placement
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 60,
    minimum_width = 280,
    maximum_width = 280,
    minimum_height = 120,

    -- desktop layer: bspwm will not tile or focus this
    own_window = true,
    own_window_type = 'desktop',
    own_window_class = 'Conky',
    own_window_title = 'todo_widget',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_colour = C.bg,
    own_window_argb_value = 220,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    background = true,
    double_buffer = true,
    update_interval = 2.0,

    border_inner_margin = 14,
    border_outer_margin = 0,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=10',
    xftalpha = 1,
    override_utf8_locale = true,
    use_spacer = 'none',
    uppercase = false,
    extra_newline = false,

    default_color = C.fg,
